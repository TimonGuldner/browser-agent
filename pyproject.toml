[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timon-browser-agent"
version = "0.4.0"
description = "Cost-optimized GitHub Actions LinkedIn agent with local Chromium, Supabase control plane, Airtable CRM and GPT-5.6 Luna"
requires-python = ">=3.12,<4.0"
dependencies = [
  "browser-use==0.13.10",
  "playwright>=1.55,<2.0",
  "supabase>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic-settings>=2.0,<3.0",
  "cryptography>=43,<47",
  "openai>=2.0,<3.0",
]

[tool.setuptools]
packages = ["agent"]

[tool.ruff]
line-length = 120
