name: LOCENIX Google Ads Conversion V6 Pinggy

on:
  push:
    branches: [main]
    paths:
      - google_ads_v6_wake.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locenix-google-ads-v6
  cancel-in-progress: true

jobs:
  login-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-google-ads-v6-unused.tar.gz.enc
      GOOGLE_LOGIN_TIMEOUT_SECONDS: "1200"

    steps:
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || exit 1
          test -n "$OPENAI_API_KEY" || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify openssh-client
      - name: Start externally preflighted Pinggy login browser
        run: python -m agent.google_ads_v6_pinggy start
      - name: Upload private login credentials
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-v6-pinggy-credentials
          path: google_ads_v6_credentials.json
          retention-days: 1
          if-no-files-found: error
      - name: Auto-detect login, save encrypted session, and finish conversion
        run: python -m agent.google_ads_v6_pinggy run
      - name: Persist sanitized result
        if: always()
        run: |
          if [[ -f google_ads_conversion_result.json ]]; then
            git config user.name "LOCENIX Browser Agent"
            git config user.email "actions@users.noreply.github.com"
            git add google_ads_conversion_result.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record Google Ads V6 conversion result"
              git pull --rebase origin main || true
              git push || true
            fi
          fi
