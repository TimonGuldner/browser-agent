name: LOCENIX Google Ads Login + Conversion V5

on:
  push:
    branches: [main]
    paths:
      - google_ads_login_v5_wake.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locenix-google-ads-v5
  cancel-in-progress: true

jobs:
  login-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-google-ads-v5.tar.gz.enc
      GOOGLE_LOGIN_TIMEOUT_SECONDS: "900"

    steps:
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || exit 1
          test -n "$OPENAI_API_KEY" || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
      - name: Start Google Ads login browser
        run: python -m agent.google_ads_login_v5 start
      - name: Upload private login credentials
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-login-v5-credentials
          path: google_ads_login_v5_credentials.json
          retention-days: 1
      - name: Auto-detect login and run conversion in same browser
        run: python -m agent.google_ads_login_v5 run
      - name: Persist sanitized conversion result
        if: always()
        run: |
          if [[ -f google_ads_conversion_result.json ]]; then
            git config user.name "LOCENIX Browser Agent"
            git config user.email "actions@users.noreply.github.com"
            git add google_ads_conversion_result.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record Google Ads conversion setup result"
              git pull --rebase origin main || true
              git push || true
            fi
          fi
