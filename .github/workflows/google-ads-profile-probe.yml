name: LOCENIX Google Ads Profile Probe

on:
  push:
    branches: [main]
    paths:
      - google_ads_profile_probe_wake.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locenix-google-ads-profile-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-google-ads-v4.tar.gz.enc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
      - name: Probe stored Google Ads profile
        run: python -m agent.google_ads_profile_probe
      - name: Persist sanitized probe result
        run: |
          git config user.name "LOCENIX Browser Agent"
          git config user.email "actions@users.noreply.github.com"
          git add google_ads_profile_probe_result.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Google Ads profile probe result"
            git pull --rebase origin main || true
            git push || true
          fi
