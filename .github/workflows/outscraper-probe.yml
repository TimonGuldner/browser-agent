name: LOCENIX Outscraper Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
      OUTSCRAPER_TEST_QUERY: "Physiotherapie, Köln, Deutschland"
      OUTSCRAPER_TEST_LIMIT: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Probe Outscraper Maps + contacts/social enrichment
        run: python -m agent.outscraper_probe
