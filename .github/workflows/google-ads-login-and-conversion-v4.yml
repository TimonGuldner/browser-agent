name: LOCENIX Google Ads Login + Conversion V4

on:
  push:
    branches: [main]
    paths:
      - google_ads_login_v4_wake.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locenix-google-ads-v4
  cancel-in-progress: true

jobs:
  login-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-google-ads-v4.tar.gz.enc
      GOOGLE_LOGIN_TIMEOUT_SECONDS: "900"

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "Missing OPENAI_API_KEY" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Start isolated Google Ads login browser
        run: python -m agent.google_ads_login_v4 start

      - name: Upload private login credentials
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-login-v4-credentials
          path: google_ads_login_v4_credentials.json
          retention-days: 1
          if-no-files-found: error

      - name: Wait for ChatGPT login confirmation and save profile
        run: python -m agent.google_ads_login_v4 wait

      - name: Run bounded Google Ads conversion setup
        run: python -m agent.google_ads_conversion_setup

      - name: Persist sanitized conversion result
        shell: bash
        run: |
          if [[ -f google_ads_conversion_result.json ]]; then
            git config user.name "LOCENIX Browser Agent"
            git config user.email "actions@users.noreply.github.com"
            git add google_ads_conversion_result.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record Google Ads conversion setup result"
              git push
            fi
          fi
