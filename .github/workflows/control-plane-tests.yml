name: LOCENIX Control Plane Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/control_plane.py"
      - "agent/cost_control.py"
      - "agent/llm_router.py"
      - "tests/test_control_plane.py"
      - "tests/integration_control_plane.py"
      - "sql/migrations/**"
      - ".github/workflows/control-plane-tests.yml"
permissions:
  contents: read
concurrency:
  group: locenix-control-plane-tests
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_control_plane tests.test_company_foundation
  integration:
    runs-on: ubuntu-latest
    needs: unit
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require real control-plane credentials
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Run real Supabase lifecycle canary
        run: python tests/integration_control_plane.py
