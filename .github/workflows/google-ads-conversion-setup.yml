name: LOCENIX Google Ads Conversion Setup

on:
  push:
    branches: [main]
    paths:
      - google_ads_conversion_wake.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locenix-google-ads-conversion-setup
  cancel-in-progress: false

jobs:
  setup-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-linkedin.tar.gz.enc

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "Missing OPENAI_API_KEY" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run bounded Google Ads conversion setup
        run: python -m agent.google_ads_conversion_setup

      - name: Persist sanitized result
        shell: bash
        run: |
          if [[ -f google_ads_conversion_result.json ]]; then
            git config user.name "LOCENIX Browser Agent"
            git config user.email "actions@users.noreply.github.com"
            git add google_ads_conversion_result.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record Google Ads conversion setup result"
              git push
            fi
          fi
