name: LOCENIX Hierarchical Closed Loop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [wake.txt]
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
  id-token: write
concurrency:
  group: locenix-browser-agent
  cancel-in-progress: false
jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      AIRTABLE_BASE_ID: appN6ox7fjGFyXZhL
      AIRTABLE_SALES_BASE_ID: appuPKnVyLsbWbxMR
      AIRTABLE_SALES_TABLE_ID: tblF4ghkYFzkeQwsT
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
      GOOGLE_DEFAULT_MODEL: gemini-3.6-flash
      GOOGLE_STRONG_MODEL: gemini-3.1-pro-preview
      GOOGLE_LITE_MODELS: gemini-2.5-flash-lite
      GOOGLE_FLASH_MODELS: gemini-3.6-flash
      OPENAI_DEFAULT_MODEL: gpt-5.6-luna
      ANTHROPIC_DEFAULT_MODEL: claude-sonnet-4-6
      LOCENIX_CHEAP_PROVIDER_ORDER: google,openai,anthropic
      LOCENIX_STANDARD_PROVIDER_ORDER: google,openai,anthropic
      LOCENIX_STRONG_PROVIDER_ORDER: anthropic,google
      OPENAI_CHEAP_MODEL: gpt-5.6-luna
      OPENAI_STANDARD_MODEL: gpt-5.6-luna
      ANTHROPIC_STRONG_MODEL: claude-sonnet-4-6
      LOCENIX_CHEAP_LLM_MAX_COST_EUR: "0.01"
      LOCENIX_STANDARD_LLM_MAX_COST_EUR: "0.03"
      LOCENIX_STRONG_LLM_MAX_COST_EUR: "0.20"
      MONTHLY_LLM_BUDGET_USD: "10"
      EMAIL_DAILY_LIMIT: "20"
      AGENT_WORKER_ID: GITHUB_BROWSER_WORKER
      LOCENIX_AGENT_ID: GITHUB_BROWSER_WORKER
      LOCENIX_DEPARTMENT: DISTRIBUTION
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-linkedin.tar.gz.enc
      MAX_RUNTIME_SECONDS: "1200"
    steps:
      - name: Check configuration
        id: config
        run: |
          if [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and validate
        if: steps.config.outputs.ready == 'true'
        run: |
          pip install -e .
          python -m compileall -q agent
          python -m agent.llm_router_selftest
      - name: CONTROL PLANE — heartbeats
        if: steps.config.outputs.ready == 'true'
        run: |
          for AGENT_ID in CEO SCHEDULER WATCHDOG; do
            curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/company_heartbeat" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"p_agent_id\":\"$AGENT_ID\",\"p_status\":\"active\",\"p_metadata\":{\"source\":\"github_actions_closed_loop\"}}" >/dev/null
          done
      - name: MEASURE — Agent 0 CEO
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python -u -m agent.ceo_supervisor
      - name: DELEGATE — Sales Head
        if: steps.config.outputs.ready == 'true' && env.AIRTABLE_PAT != ''
        continue-on-error: true
        run: python -u -m agent.sales_head
      - name: DELEGATE — Growth Head
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python -u -m agent.growth_head
      - name: DELEGATE — Ops Head
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python -u -m agent.ops_head
      - name: SALES — Email controller measurement
        if: steps.config.outputs.ready == 'true' && env.AIRTABLE_PAT != ''
        continue-on-error: true
        run: python -u -m agent.email_quota_enforcer
      - name: SALES — Email Copy Agent
        if: steps.config.outputs.ready == 'true' && env.AIRTABLE_PAT != ''
        continue-on-error: true
        env:
          EMAIL_COPY_LIMIT: "20"
        run: python -u -m agent.email_copy_worker
      - name: SALES — Email Sender Worker
        if: steps.config.outputs.ready == 'true' && env.RESEND_API_KEY != '' && env.AIRTABLE_PAT != ''
        continue-on-error: true
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_PAT }}
          EMAIL_FROM: 'Timon Guldner <hello@locenix.com>'
          EMAIL_REPLY_TO: 'hello@locenix.com'
        run: python -u -m agent.email_outreach_worker
      - name: LIFECYCLE — Welcome and recovery emails
        if: steps.config.outputs.ready == 'true' && env.RESEND_API_KEY != ''
        continue-on-error: true
        env:
          LOCENIX_BASE_URL: https://locenix.com
          EMAIL_FROM: 'LOCENIX <hello@locenix.com>'
        run: |
          set -uo pipefail
          OIDC_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=locenix-lifecycle")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')
          if [[ -z "$OIDC_TOKEN" || "$OIDC_TOKEN" == "null" ]]; then
            echo "Lifecycle: no GitHub OIDC token"
            exit 1
          fi

          CLAIM=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            "${LOCENIX_BASE_URL}/api/lifecycle/github/claim")
          CLAIMED=$(printf '%s' "$CLAIM" | jq -r '.claimed // 0')
          echo "Lifecycle: claimed=${CLAIMED}"

          printf '%s' "$CLAIM" | jq -c '.events[]?' | while IFS= read -r ITEM; do
            EVENT_ID=$(printf '%s' "$ITEM" | jq -r '.id')
            IDEMPOTENCY_KEY=$(printf '%s' "$ITEM" | jq -r '.idempotency_key')
            SEND_PAYLOAD=$(printf '%s' "$ITEM" | jq -c --arg from "$EMAIL_FROM" '{from:$from,to:[.to],subject:.subject,html:.html,headers:(.headers // {})}')

            RAW=$(curl --silent --show-error -w $'\n%{http_code}' -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer ${RESEND_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
              -d "$SEND_PAYLOAD" || true)
            HTTP_CODE=$(printf '%s\n' "$RAW" | tail -n 1)
            BODY=$(printf '%s\n' "$RAW" | sed '$d')

            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]] && [[ "$(printf '%s' "$BODY" | jq -r '.id // empty' 2>/dev/null)" != "" ]]; then
              MESSAGE_ID=$(printf '%s' "$BODY" | jq -r '.id')
              RESULT=$(jq -nc --arg id "$EVENT_ID" --arg message_id "$MESSAGE_ID" '{id:$id,ok:true,provider_message_id:$message_id}')
              echo "Lifecycle: sent event=${EVENT_ID}"
            else
              ERROR_TEXT=$(printf '%s' "$BODY" | jq -r '.message // .error // "Resend send failed"' 2>/dev/null || echo "Resend send failed")
              RESULT=$(jq -nc --arg id "$EVENT_ID" --arg error "$ERROR_TEXT" '{id:$id,ok:false,error:$error}')
              echo "Lifecycle: failed event=${EVENT_ID} http=${HTTP_CODE}"
            fi

            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$RESULT" \
              "${LOCENIX_BASE_URL}/api/lifecycle/github/result" >/dev/null
          done
      - name: OPS — deterministic supervisor
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python -u -m agent.supervisor
      - name: SALES — LinkedIn closed-loop enforcer
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python -u -m agent.linkedin_execution_enforcer_v3
      - name: OPS — enqueue schedules
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/enqueue_due_agent_jobs" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{"p_lookback_minutes":120}' >/tmp/scheduler.json
      - name: GROWTH — deterministic execution and experiment deadlines
        if: steps.config.outputs.ready == 'true'
        env:
          PRODUCT_GITHUB_TOKEN: ${{ secrets.PRODUCT_GITHUB_TOKEN }}
        run: python -u -m agent.growth_execution tick
      - name: WATCHDOG — detect and resolve incidents
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python -u -m agent.control_plane watchdog
      - name: OPS — check queue
        if: steps.config.outputs.ready == 'true'
        id: queue
        continue-on-error: true
        run: |
          RESPONSE=$(curl --fail --silent --show-error "$SUPABASE_URL/rest/v1/agent_jobs?status=eq.queued&select=id,mode,priority&order=priority.desc,created_at.asc&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY") || RESPONSE="[]"
          if [[ "$RESPONSE" == "[]" ]]; then echo "has_work=false" >> "$GITHUB_OUTPUT"; else echo "has_work=true" >> "$GITHUB_OUTPUT"; fi
      - name: OPS — install Chromium if required
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_work == 'true'
        run: python -m playwright install --with-deps chromium
      - name: EXECUTE — bounded worker queue
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_work == 'true'
        continue-on-error: true
        run: |
          for n in 1 2 3 4 5 6; do python -m agent.airtable_worker --once || echo "RETRY worker=$n"; done
      - name: VERIFY — Sales Head
        if: always() && steps.config.outputs.ready == 'true' && env.AIRTABLE_PAT != ''
        continue-on-error: true
        run: python -u -m agent.sales_head
      - name: VERIFY — Agent 0 CEO
        if: always() && steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: python -u -m agent.ceo_supervisor
      - name: ESCALATE — repair agent
        if: always() && steps.config.outputs.ready == 'true' && (env.OPENAI_API_KEY != '' || env.GOOGLE_API_KEY != '' || env.ANTHROPIC_API_KEY != '')
        continue-on-error: true
        run: python -u -m agent.repair_agent
