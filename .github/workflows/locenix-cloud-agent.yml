name: LOCENIX Cost-Optimized Browser Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wake.txt
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: locenix-browser-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      AIRTABLE_BASE_ID: appN6ox7fjGFyXZhL
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      MONTHLY_LLM_BUDGET_USD: "10"
      INBOX_FORCE_LLM_HOURS: "4"
      AGENT_WORKER_ID: github-actions-airtable-v4-luna
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-linkedin.tar.gz.enc
      LOGIN_TIMEOUT_SECONDS: "900"
      MAX_RUNTIME_SECONDS: "1200"

    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LOCENIX agent is waiting for SUPABASE_SERVICE_ROLE_KEY."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$AIRTABLE_PAT" ]]; then
            echo "Airtable is not connected. Scheduled CRM jobs fail closed."
          fi
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OpenAI API is not connected yet. Zero-LLM gates/login can still work; AI jobs fail closed."
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: steps.config.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run LOCENIX supervisor
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          python -m agent.supervisor

      - name: Enqueue due Supabase schedules
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/enqueue_due_agent_jobs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_lookback_minutes":120}' >/tmp/scheduler.json
          echo "Supabase scheduler checked successfully."

      - name: Check queued work
        if: steps.config.outputs.ready == 'true'
        id: queue
        shell: bash
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/agent_jobs?status=eq.queued&select=id,mode&order=priority.asc,created_at.asc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          if [[ "$RESPONSE" == "[]" ]]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "needs_login=false" >> "$GITHUB_OUTPUT"
            echo "No queued LOCENIX work. Heavy browser setup skipped."
          else
            MODE=$(echo "$RESPONSE" | jq -r '.[0].mode // ""')
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            if [[ "$MODE" == "login" ]]; then
              echo "needs_login=true" >> "$GITHUB_OUTPUT"
            else
              echo "needs_login=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Queued LOCENIX work found."
          fi

      - name: Install Chromium
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_work == 'true'
        shell: bash
        run: |
          python -m playwright install --with-deps chromium

      - name: Install remote login tools only when needed
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_work == 'true' && steps.queue.outputs.needs_login == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify
          curl -fsSL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Process up to six queued jobs
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_work == 'true'
        shell: bash
        run: |
          for n in 1 2 3 4 5 6; do
            python -m agent.airtable_worker --once
          done
