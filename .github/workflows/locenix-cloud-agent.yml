name: LOCENIX Free Browser Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wake.txt
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: locenix-free-browser-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      AIRTABLE_BASE_ID: appN6ox7fjGFyXZhL
      AGENT_WORKER_ID: github-actions-airtable-v2
      PROFILE_BUCKET: locenix-agent-private
      PROFILE_OBJECT: profiles/locenix-linkedin.tar.gz.enc
      OLLAMA_MODEL: qwen3:1.7b
      OLLAMA_HOST: http://127.0.0.1:11434
      LOGIN_TIMEOUT_SECONDS: "900"
      MAX_RUNTIME_SECONDS: "1200"

    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LOCENIX agent is waiting for SUPABASE_SERVICE_ROLE_KEY."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$AIRTABLE_PAT" ]]; then
            echo "Airtable is not connected yet. Browser/login jobs can still run; CRM tools will stay disabled."
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: steps.config.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Chromium and remote-login tools
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify
          curl -fsSL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Cache local AI model
        if: steps.config.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen3-1.7b-v1

      - name: Install Ollama
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Process queued jobs
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          for n in 1 2 3; do
            python -m agent.airtable_worker --once || true
          done
