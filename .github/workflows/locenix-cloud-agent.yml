name: LOCENIX Cloud Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wake.txt
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: locenix-cloud-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
      BROWSER_USE_MODEL: gpt-5.6-luna
      BROWSER_USE_PROXY_COUNTRY: de
      BROWSER_USE_MAX_COST_USD: "1.00"
      MAX_RUNTIME_SECONDS: "1200"
      POLL_SECONDS: "4"

    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" || -z "$BROWSER_USE_API_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LOCENIX agent is waiting for repository secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        if: steps.config.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Process queued jobs
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          for n in 1 2 3 4 5; do
            python -m agent.cloud_worker --once
          done
