name: LOCENIX LinkedIn Department Head Agent 8

on:
  workflow_dispatch:
  push:
    paths:
      - 'wake_linkedin_department.txt'
      - 'tasks/linkedin_department_head.json'
      - 'agent/linkedin_department_head.py'
  schedule:
    - cron: '20 6,7,14,15 * * *'

permissions:
  contents: write

concurrency:
  group: locenix-linkedin-department-head
  cancel-in-progress: false

jobs:
  management-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Berlin management-review gate
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Berlin'))
          if not (now.minute == 20 and now.hour in (8, 16)):
              raise SystemExit('Not a LinkedIn management review slot')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run LinkedIn Department Head Agent 8
        run: python -m agent.linkedin_department_head

      - name: Commit department report
        run: |
          git config user.name 'locenix-linkedin-department-head'
          git config user.email 'actions@users.noreply.github.com'
          git add results/linkedin_department_latest.json results/linkedin_department_state.json
          if git diff --cached --quiet; then
            echo 'No department report changes'
          else
            git commit -m 'Update LinkedIn department management report'
            git pull --rebase
            git push
          fi
