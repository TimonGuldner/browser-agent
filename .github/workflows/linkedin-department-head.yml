name: LOCENIX LinkedIn Department Head Agent 8

on:
  workflow_dispatch:
  push:
    paths:
      - 'wake_linkedin_department.txt'
      - 'tasks/linkedin_department_head.json'
      - 'tasks/linkedin_engagement_agent.json'
      - 'agent/linkedin_department_head.py'
      - 'agent/linkedin_execution_enforcer.py'
      - 'agent/linkedin_department_control.py'
  schedule:
    - cron: '20 6-18 * * *'

permissions:
  contents: write

concurrency:
  group: locenix-linkedin-department-head
  cancel-in-progress: false

jobs:
  management-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://lzqybaxpgwkqyysluivg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      AIRTABLE_BASE_ID: appN6ox7fjGFyXZhL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Berlin management-review slot
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run_review=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Berlin'))
          print('run_review=' + ('true' if now.minute == 20 and 8 <= now.hour < 20 else 'false'))
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_review == 'true'
        with:
          python-version: '3.12'

      - name: Run LinkedIn Department Head Agent 8
        if: steps.gate.outputs.run_review == 'true'
        run: python -m agent.linkedin_department_head

      - name: Enforce department execution targets
        if: steps.gate.outputs.run_review == 'true'
        run: python -m agent.linkedin_execution_enforcer

      - name: Verify target actual gap action control
        if: steps.gate.outputs.run_review == 'true'
        run: python -m agent.linkedin_department_control

      - name: Commit department report
        if: steps.gate.outputs.run_review == 'true'
        run: |
          git config user.name 'locenix-linkedin-department-head'
          git config user.email 'actions@users.noreply.github.com'
          git add results/linkedin_department_latest.json results/linkedin_department_state.json results/linkedin_execution_state.json results/linkedin_control_state.json results/linkedin_control_latest.json
          if git diff --cached --quiet; then
            echo 'No department report changes'
          else
            git commit -m 'Update LinkedIn department management, execution and control report'
            git pull --rebase
            git push
          fi
